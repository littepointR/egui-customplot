    function swapTextLabel(el, lang) {
        if (!el) return;
        for (var i = 0; i < el.childNodes.length; i++) {
            var n = el.childNodes[i];
            if (n.nodeType === 3 && n.nodeValue && n.nodeValue.trim() !== "") {
                if (el.dataset.cpOrigLabel === undefined) {
                    el.dataset.cpOrigLabel = n.nodeValue;
                }
                if (lang === "zh") {
                    var key = el.dataset.cpOrigLabel.trim();
                    if (ZH_SUMMARIES[key] === undefined && SECTION_LABELS[key]) {
                        n.nodeValue = SECTION_LABELS[key];
                    } else if (SECTION_LABELS[key]) {
                        n.nodeValue = SECTION_LABELS[key];
                    }
                } else {
                    n.nodeValue = el.dataset.cpOrigLabel;
                }
                break;
            }
        }
    }

    function syncSectionLabels(lang) {
        var nodes = document.querySelectorAll(
            "h2.section-header, #rustdoc-toc > h3 > a, #all-types"
        );
        for (var i = 0; i < nodes.length; i++) {
            swapTextLabel(nodes[i], lang);
        }
    }

    function syncItemTables(lang) {
        var dts = document.querySelectorAll("dl.item-table > dt");
        for (var i = 0; i < dts.length; i++) {
            var dt = dts[i];
            var dd = dt.nextElementSibling;
            if (!dd || dd.tagName !== "DD") continue;
            var link = dt.querySelector("a");
            if (!link) continue;
            var name = (link.textContent || "").trim();
            var zh = ZH_SUMMARIES[name];
            if (!zh) continue;
            if (dd.dataset.cpOrigHtml === undefined) {
                dd.dataset.cpOrigHtml = dd.innerHTML;
            }
            if (lang === "zh") {
                dd.textContent = zh;
            } else {
                dd.innerHTML = dd.dataset.cpOrigHtml;
            }
        }
    }

    function tagBilingualDocblocks() {
        var cjkRe = /[\u4e00-\u9fff]/;
        var docs = document.querySelectorAll(".docblock");
        for (var d = 0; d < docs.length; d++) {
            var doc = docs[d];
            if (doc.querySelector(".cp-lang-en, .cp-lang-zh")) continue;
            var children = [];
            for (var i = 0; i < doc.children.length; i++) {
                var ch = doc.children[i];
                if (/^(P|UL|OL|BLOCKQUOTE)$/.test(ch.tagName)) {
                    children.push(ch);
                }
            }
            var hasZh = false;
            var hasEn = false;
            for (var j = 0; j < children.length; j++) {
                if (cjkRe.test(children[j].textContent || "")) hasZh = true;
                else hasEn = true;
            }
            if (hasZh && hasEn) {
                for (var k = 0; k < children.length; k++) {
                    var isZh = cjkRe.test(children[k].textContent || "");
                    children[k].setAttribute("data-cp-lang-block", isZh ? "zh" : "en");
                }
            }
        }
    }

            var li = tocItems[i];
            var a = li.querySelector(":scope > a[href^='#']");
            if (!a) continue;
            var id = "";
            try {
                id = decodeURIComponent(a.getAttribute("href").slice(1));
            } catch (_) {}
            if (!id) continue;
            var target = document.getElementById(id);
            if (!target) continue;
            if (target.closest(".cp-lang-zh")) {
                li.setAttribute("data-cp-lang-block", "zh");
            } else if (target.closest(".cp-lang-en")) {
                li.setAttribute("data-cp-lang-block", "en");
            }
        }
    }

    function buildSwitcher() {
        var box = document.createElement("span");
        box.className = "cp-lang-switcher";
        box.setAttribute("role", "group");
        box.setAttribute("aria-label", "Documentation language");
        var defs = [
            ["en", "EN"],
            ["zh", "简体中文"]
        ];
        for (var i = 0; i < defs.length; i++) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "cp-lang-btn";
            btn.setAttribute("data-cp-set-lang", defs[i][0]);
            btn.textContent = defs[i][1];
            btn.addEventListener("click", (function (code) {
                return function (ev) {
                    ev.preventDefault();
                    ev.stopPropagation();
                    applyLang(code, true);
                };
            })(defs[i][0]));
            box.appendChild(btn);
        }
        return box;
    }

    function applyLang(lang, persist) {
        var code = normalizeLang(lang) || "en";
        document.documentElement.setAttribute("data-cp-lang", code);
        document.documentElement.lang = code === "zh" ? "zh-CN" : "en";
        if (persist) {
            try {
                window.localStorage.setItem(STORAGE_KEY, code);
            } catch (_) {}
        }
        var btns = document.querySelectorAll(".cp-lang-btn");
        for (var i = 0; i < btns.length; i++) {
            var active = btns[i].getAttribute("data-cp-set-lang") === code;
            btns[i].setAttribute("aria-pressed", active ? "true" : "false");
        }
        syncSectionLabels(code);
        syncItemTables(code);
    }

    function mountSwitchers() {
        var sub = document.querySelector(".main-heading .sub-heading");
        if (sub) {
            sub.insertBefore(buildSwitcher(), sub.firstChild);
        } else {
            var heading = document.querySelector(".main-heading");
            if (heading) heading.appendChild(buildSwitcher());
        }
        var sidebar = document.querySelector(".sidebar-crate");
        if (sidebar) {
            sidebar.appendChild(buildSwitcher());
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        tagBilingualDocblocks();
        tagSidebarToc();
        mountSwitchers();
        applyLang(document.documentElement.getAttribute("data-cp-lang") || "en", false);
    });
})();
</script>
