[package]
name = "egui-customplot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "An embeddable scientific plotting prototype for egui"

[features]
default = []
export = ["dep:png"]
wgpu = ["dep:egui-wgpu", "dep:wgpu", "dep:bytemuck"]

[dependencies]
egui.workspace = true
png = { version = "0.18.1", optional = true }
egui-wgpu = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts"] }
roxmltree = "0.21.1"
resvg = { version = "0.48.1", default-features = false, features = ["raster-images"] }

[[bench]]
name = "frame_baseline"
harness = false

[[bench]]
name = "data_performance"
harness = false

[[bench]]
name = "stream_stress"
harness = false

[[bench]]
name = "heatmap_performance"
harness = false

[[bench]]
name = "stems_performance"
harness = false

[[bench]]
name = "quiver_performance"
harness = false

[[bench]]
name = "polygon_contour_performance"
harness = false

[[bench]]
name = "stage8b_performance"
harness = false

[[bench]]
name = "stage8c_performance"
harness = false

[[bench]]
name = "stage8d_performance"
harness = false

[[bench]]
name = "stage9a_performance"
harness = false

[[bench]]
name = "stage9b_performance"
harness = false

[[bench]]
name = "stage9c_performance"
harness = false

[[bench]]
name = "stage10_performance"
harness = false

[[bench]]
name = "dynamic_10m_performance"
harness = false

[[bench]]
name = "stage16_performance"
harness = false

[[example]]
name = "export_snapshot"
required-features = ["export"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/rustdoc-i18n-header.html"]
