[workspace]
members = ["crates/egui-customplot", "examples/demo"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/littepointR/egui-customplot"

[workspace.dependencies]
egui = { version = "0.37.0", default-features = false }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wgpu", "x11", "wayland"] }
egui-wgpu = { version = "0.37.0", default-features = false }
wgpu = { version = "30.0.2", default-features = false, features = ["std", "wgsl"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
egui-customplot = { path = "crates/egui-customplot", version = "0.1.1" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
