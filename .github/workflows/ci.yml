name: Rust
on: [push, pull_request]

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk space on Linux
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux windowing dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --all-features --locked
      - run: cargo test -p egui-customplot --no-default-features --locked
      - run: cargo doc -p egui-customplot --no-deps --no-default-features --locked
      - run: cargo doc --workspace --no-deps --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo publish -p egui-customplot --dry-run --locked
      - run: cargo package -p egui-customplot --locked --no-verify --target-dir target/license-check
      - name: Verify packaged licenses
        shell: python
        run: |
          import tarfile
          from pathlib import Path

          archive, = Path("target/license-check/package").glob("egui-customplot-*.crate")
          with tarfile.open(archive) as package:
              for name in ("LICENSE-MIT", "LICENSE-APACHE"):
                  if package.extractfile(f"{archive.stem}/{name}").read() != Path(name).read_bytes():
                      raise ValueError(f"Packaged {name} differs from the repository license")
      - run: cargo build -p customplot-demo --release --locked
