name: Publish to crates.io
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk space on Linux
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux windowing dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev
      - name: Verify tag matches crate version
        if: github.ref_type == 'tag'
        run: |
          pkg_ver=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; pkgs=json.load(sys.stdin)['packages']; print(next(p['version'] for p in pkgs if p['name']=='egui-customplot'))")
          tag_name="${GITHUB_REF_NAME#v}"
          if [ "$pkg_ver" != "$tag_name" ]; then
            echo "Tag $GITHUB_REF_NAME does not match egui-customplot version $pkg_ver"
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features --locked
      - run: cargo doc -p egui-customplot --no-deps --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Publish egui-customplot to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "Missing CARGO_REGISTRY_TOKEN repository secret. Configure it in GitHub Settings -> Secrets and variables -> Actions -> CARGO_REGISTRY_TOKEN."
            exit 1
          fi
          cargo publish -p egui-customplot --locked
